[project]
name = "market-jury-mcp"
version = "0.1.0"
description = "MCP server exposing the engine's research, regime and accountability tools to AI assistants"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2", "httpx>=0.27"]

[project.scripts]
engine-mcp = "sudo_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
